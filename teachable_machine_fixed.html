<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f13;
      color: #f0f0f0;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px;
    }
    h1 {
      font-size: 1.1rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #7df9b6;
      opacity: 0.85;
    }
    #start-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    #start-btn {
      background: #7df9b6;
      color: #0f0f13;
      border: none;
      padding: 14px 40px;
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    #start-btn:hover { opacity: 0.85; }
    #start-hint {
      font-size: 0.75rem;
      color: #555;
      letter-spacing: 0.1em;
    }
    #main-screen { display: none; flex-direction: column; align-items: center; gap: 20px; }
    #camera-wrapper {
      position: relative;
      border: 2px solid #7df9b6;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(125, 249, 182, 0.15);
    }
    #camera canvas { display: block; }
    #overlay {
      position: absolute;
      top: 8px; left: 8px;
      background: rgba(0,0,0,0.6);
      border: 1px solid #7df9b633;
      border-radius: 3px;
      padding: 4px 10px;
      font-size: 0.7rem;
      color: #7df9b6;
      letter-spacing: 0.1em;
    }
    #status { font-size: 0.8rem; color: #888; letter-spacing: 0.15em; }
    #result-box {
      background: #16161e;
      border: 1px solid #2a2a3a;
      border-radius: 6px;
      padding: 16px 28px;
      text-align: center;
      min-width: 280px;
    }
    #label { font-size: 1.5rem; font-weight: bold; color: #7df9b6; letter-spacing: 0.1em; min-height: 2rem; }
    #confidence { font-size: 0.75rem; color: #555; margin-top: 4px; letter-spacing: 0.1em; }
    .bar-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: 0.7rem; }
    .bar-label { color: #888; width: 100px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-track { flex: 1; height: 6px; background: #2a2a3a; border-radius: 3px; overflow: hidden; }
    .bar-fill { height: 100%; background: #7df9b6; border-radius: 3px; transition: width 0.2s ease; }
    .bar-pct { color: #555; width: 36px; text-align: right; }
    #bars { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
    #error-msg { color: #f97d7d; font-size: 0.8rem; letter-spacing: 0.1em; max-width: 300px; text-align: center; }
  </style>
</head>
<body>
  <h1>Teachable Machine</h1>

  <!-- Layar awal: tombol mulai -->
  <div id="start-screen">
    <div id="start-hint">Klik tombol untuk mengaktifkan kamera</div>
    <button id="start-btn" onclick="startApp()">▶ Mulai</button>
    <div id="error-msg"></div>
  </div>

  <!-- Layar utama: kamera + hasil -->
  <div id="main-screen">
    <div id="camera-wrapper">
      <div id="camera"></div>
      <div id="overlay">LIVE</div>
    </div>
    <div id="status">Memuat model...</div>
    <div id="result-box">
      <div id="label">—</div>
      <div id="confidence">Menunggu deteksi...</div>
      <div id="bars"></div>
    </div>
  </div>

  <script>
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/QJn4u9mDQ/";
    let model, webcam;

    async function startApp() {
      // Sembunyikan tombol, tampilkan layar utama
      document.getElementById("start-screen").style.display = "none";
      document.getElementById("main-screen").style.display = "flex";

      try {
        document.getElementById("status").textContent = "Memuat model...";
        model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");

        document.getElementById("status").textContent = "Menyalakan kamera...";
        webcam = new tmImage.Webcam(300, 300, true);
        await webcam.setup();
        await webcam.play(); // aman karena dipanggil dari klik user

        document.getElementById("camera").appendChild(webcam.canvas);
        document.getElementById("status").textContent = "Mendeteksi...";

        // Buat bar untuk setiap kelas
        const barsDiv = document.getElementById("bars");
        for (let i = 0; i < model.getTotalClasses(); i++) {
          const row = document.createElement("div");
          row.className = "bar-row";
          row.innerHTML = `
            <span class="bar-label" id="blabel-${i}"></span>
            <div class="bar-track"><div class="bar-fill" id="bfill-${i}" style="width:0%"></div></div>
            <span class="bar-pct" id="bpct-${i}">0%</span>
          `;
          barsDiv.appendChild(row);
        }

        window.requestAnimationFrame(loop);
      } catch (err) {
        // Kalau error, kembali ke layar awal dan tampilkan pesan
        document.getElementById("main-screen").style.display = "none";
        document.getElementById("start-screen").style.display = "flex";
        document.getElementById("error-msg").textContent = "Error: " + err.message;
        console.error(err);
      }
    }

    async function loop() {
      webcam.update();
      await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const prediction = await model.predict(webcam.canvas);

      let highest = prediction[0];
      for (let i = 1; i < prediction.length; i++) {
        if (prediction[i].probability > highest.probability) highest = prediction[i];
      }

      document.getElementById("label").textContent = highest.className;
      const pct = (highest.probability * 100).toFixed(1);
      document.getElementById("confidence").textContent = `Kepercayaan: ${pct}%`;

      for (let i = 0; i < prediction.length; i++) {
        const p = prediction[i];
        const w = (p.probability * 100).toFixed(1);
        const lEl = document.getElementById("blabel-" + i);
        const fEl = document.getElementById("bfill-" + i);
        const pEl = document.getElementById("bpct-" + i);
        if (lEl) lEl.textContent = p.className;
        if (fEl) fEl.style.width = w + "%";
        if (pEl) pEl.textContent = w + "%";
      }

      if (highest.probability > 0.9 && window.AppInventor) {
        window.AppInventor.setWebViewString(highest.className);
      }
    }
  </script>
</body>
</html>
