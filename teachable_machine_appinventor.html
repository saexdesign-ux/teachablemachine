<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f13;
      color: #f0f0f0;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 20px;
    }
    h1 { font-size: 1rem; letter-spacing: 0.3em; text-transform: uppercase; color: #7df9b6; }

    /* START SCREEN */
    #start-screen { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    #start-btn {
      background: #7df9b6; color: #0f0f13;
      border: none; padding: 14px 40px;
      font-family: 'Courier New', monospace;
      font-size: 1rem; font-weight: bold;
      letter-spacing: 0.2em; text-transform: uppercase;
      border-radius: 4px; cursor: pointer; transition: opacity 0.2s;
    }
    #start-btn:hover { opacity: 0.85; }
    #error-msg { color: #f97d7d; font-size: 0.75rem; max-width: 300px; text-align: center; }

    /* MAIN SCREEN */
    #main-screen { display: none; flex-direction: column; align-items: center; gap: 14px; }
    #camera-wrapper {
      position: relative;
      border: 2px solid #7df9b6; border-radius: 4px; overflow: hidden;
      box-shadow: 0 0 30px rgba(125,249,182,0.15);
    }
    #camera canvas { display: block; }
    #live-badge {
      position: absolute; top: 8px; left: 8px;
      background: rgba(0,0,0,0.65); border: 1px solid #7df9b644;
      border-radius: 3px; padding: 3px 10px;
      font-size: 0.65rem; color: #7df9b6; letter-spacing: 0.15em;
    }

    /* RESULT */
    #result-box {
      background: #16161e; border: 1px solid #2a2a3a;
      border-radius: 6px; padding: 14px 24px;
      text-align: center; width: 300px;
    }
    #label { font-size: 1.4rem; font-weight: bold; color: #7df9b6; letter-spacing: 0.08em; min-height: 1.8rem; }
    #confidence { font-size: 0.72rem; color: #555; margin-top: 3px; }

    /* BARS */
    #bars { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
    .bar-row { display: flex; align-items: center; gap: 8px; font-size: 0.68rem; }
    .bar-label { color: #888; width: 90px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-track { flex: 1; height: 5px; background: #2a2a3a; border-radius: 3px; overflow: hidden; }
    .bar-fill { height: 100%; background: #7df9b6; border-radius: 3px; transition: width 0.15s ease; }
    .bar-pct { color: #444; width: 34px; text-align: right; }

    /* SEND LOG */
    #send-log {
      width: 300px; background: #0d0d10;
      border: 1px solid #1e1e2a; border-radius: 6px;
      padding: 10px 14px; font-size: 0.68rem; color: #555;
    }
    #send-log .log-title { color: #444; letter-spacing: 0.1em; margin-bottom: 6px; font-size: 0.65rem; }
    #log-entry {
      color: #7df9b6; font-size: 0.78rem;
      min-height: 1rem; word-break: break-all;
    }
    #log-time { color: #333; font-size: 0.6rem; margin-top: 2px; }

    #status { font-size: 0.72rem; color: #444; letter-spacing: 0.12em; }
  </style>
</head>
<body>
  <h1>Teachable Machine → App Inventor</h1>

  <div id="start-screen">
    <div style="font-size:0.75rem;color:#555;letter-spacing:0.1em">Klik untuk mengaktifkan kamera</div>
    <button id="start-btn" onclick="startApp()">▶ Mulai</button>
    <div id="error-msg"></div>
  </div>

  <div id="main-screen">
    <div id="camera-wrapper">
      <div id="camera"></div>
      <div id="live-badge">● LIVE</div>
    </div>
    <div id="status">Memuat model...</div>

    <div id="result-box">
      <div id="label">—</div>
      <div id="confidence">Menunggu deteksi...</div>
      <div id="bars"></div>
    </div>

    <div id="send-log">
      <div class="log-title">▸ TERAKHIR DIKIRIM KE APP INVENTOR</div>
      <div id="log-entry">—</div>
      <div id="log-time">—</div>
    </div>
  </div>

  <script>
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/QJn4u9mDQ/";
    const CONFIDENCE_THRESHOLD = 0.9;

    let model, webcam;
    let lastSent = "";  // Simpan label terakhir yang dikirim, hindari spam

    async function startApp() {
      document.getElementById("start-screen").style.display = "none";
      document.getElementById("main-screen").style.display = "flex";

      try {
        document.getElementById("status").textContent = "Memuat model...";
        model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");

        document.getElementById("status").textContent = "Menyalakan kamera...";
        webcam = new tmImage.Webcam(300, 300, true);
        await webcam.setup();
        await webcam.play();  // Aman: dipanggil dari klik user

        document.getElementById("camera").appendChild(webcam.canvas);
        document.getElementById("status").textContent = "Mendeteksi...";

        // Buat bar tiap kelas
        const barsDiv = document.getElementById("bars");
        for (let i = 0; i < model.getTotalClasses(); i++) {
          const row = document.createElement("div");
          row.className = "bar-row";
          row.innerHTML = `
            <span class="bar-label" id="blabel-${i}"></span>
            <div class="bar-track"><div class="bar-fill" id="bfill-${i}" style="width:0%"></div></div>
            <span class="bar-pct" id="bpct-${i}">0%</span>
          `;
          barsDiv.appendChild(row);
        }

        window.requestAnimationFrame(loop);
      } catch (err) {
        document.getElementById("main-screen").style.display = "none";
        document.getElementById("start-screen").style.display = "flex";
        document.getElementById("error-msg").textContent = "Error: " + err.message;
        console.error(err);
      }
    }

    async function loop() {
      webcam.update();
      await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const prediction = await model.predict(webcam.canvas);

      // Cari prediksi tertinggi
      let highest = prediction[0];
      for (let i = 1; i < prediction.length; i++) {
        if (prediction[i].probability > highest.probability) highest = prediction[i];
      }

      // Update label & confidence
      document.getElementById("label").textContent = highest.className;
      const pct = (highest.probability * 100).toFixed(1);
      document.getElementById("confidence").textContent = `Kepercayaan: ${pct}%`;

      // Update semua bar
      for (let i = 0; i < prediction.length; i++) {
        const p = prediction[i];
        const w = (p.probability * 100).toFixed(1);
        const lEl = document.getElementById("blabel-" + i);
        const fEl = document.getElementById("bfill-" + i);
        const pEl = document.getElementById("bpct-" + i);
        if (lEl) lEl.textContent = p.className;
        if (fEl) fEl.style.width = w + "%";
        if (pEl) pEl.textContent = w + "%";
      }

      // Kirim ke App Inventor HANYA jika:
      // 1. Confidence > 90%
      // 2. Label berbeda dari yang terakhir dikirim (hindari spam)
      if (highest.probability >= CONFIDENCE_THRESHOLD && highest.className !== lastSent) {
        lastSent = highest.className;

        // ✅ Cara terbaik: WebViewString — dibaca di App Inventor
        // dengan event WebViewer.WebViewStringChange
        if (window.AppInventor) {
          window.AppInventor.setWebViewString(highest.className);
        }

        // Update log tampilan
        const now = new Date();
        const timeStr = now.toLocaleTimeString("id-ID");
        document.getElementById("log-entry").textContent = "✓ " + highest.className;
        document.getElementById("log-time").textContent = timeStr + " | " + pct + "% confidence";
      }

      // Reset lastSent jika confidence turun di bawah threshold
      // agar bisa kirim ulang saat objek sama terdeteksi lagi nanti
      if (highest.probability < CONFIDENCE_THRESHOLD) {
        lastSent = "";
      }
    }
  </script>
</body>
</html>
