<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a10; color: #f0f0f0;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; padding: 20px;
    }
    h1 { font-size: 1rem; letter-spacing: 0.3em; text-transform: uppercase; color: #7df9b6; }
    .sub { font-size: 0.65rem; color: #333; letter-spacing: 0.15em; }

    #start-screen { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    #start-btn {
      background: #7df9b6; color: #0a0a10;
      border: none; padding: 14px 44px;
      font-family: 'Courier New', monospace;
      font-size: 1rem; font-weight: bold;
      letter-spacing: 0.2em; border-radius: 4px; cursor: pointer;
    }
    #start-btn:hover { opacity: 0.85; }
    #error-msg { color: #f97d7d; font-size: 0.72rem; max-width: 300px; text-align: center; }

    #main-screen { display: none; flex-direction: column; align-items: center; gap: 12px; }

    #camera-wrapper {
      position: relative;
      border: 2px solid #7df9b6; border-radius: 6px; overflow: hidden;
      box-shadow: 0 0 30px rgba(125,249,182,0.12);
    }
    #camera canvas { display: block; }
    #live-badge {
      position: absolute; top: 8px; left: 8px;
      background: rgba(0,0,0,0.7); border: 1px solid #7df9b644;
      border-radius: 3px; padding: 3px 10px;
      font-size: 0.62rem; color: #7df9b6; letter-spacing: 0.15em;
    }

    #detect-box {
      width: 300px; background: #13131a;
      border: 1px solid #1e1e2e; border-radius: 6px;
      padding: 16px 18px; text-align: center;
    }
    #nis-label { font-size: 1.8rem; font-weight: bold; color: #7df9b6; letter-spacing: 0.12em; min-height: 2.2rem; }
    #conf-label { font-size: 0.7rem; color: #444; margin-top: 4px; }

    #send-box {
      width: 300px; background: #0d0d12;
      border: 1px solid #1a1a28; border-radius: 6px;
      padding: 10px 16px;
    }
    .box-title { font-size: 0.6rem; color: #333; letter-spacing: 0.12em; margin-bottom: 6px; }
    #send-status { font-size: 0.8rem; color: #555; }
    #send-status.success { color: #7df9b6; }
    #send-status.sending { color: #f9d97d; }
    #send-status.error   { color: #f97d7d; }
    #send-time { font-size: 0.6rem; color: #2a2a3a; margin-top: 3px; }

    #log-box {
      width: 300px; background: #0d0d12;
      border: 1px solid #1a1a28; border-radius: 6px;
      padding: 10px 16px; max-height: 120px; overflow-y: auto;
    }
    .log-item { font-size: 0.68rem; color: #3a5a46; padding: 3px 0; border-bottom: 1px solid #12121a; }
    .log-item:first-child { color: #7df9b6; }
    .log-item:last-child { border-bottom: none; }

    #status-bar { font-size: 0.68rem; color: #333; letter-spacing: 0.12em; }
  </style>
</head>
<body>

  <h1>Absensi Wajah</h1>
  <div class="sub">Teachable Machine → Google Sheets</div>

  <div id="start-screen">
    <div style="font-size:0.72rem;color:#444;letter-spacing:0.1em">Klik untuk mengaktifkan kamera</div>
    <button id="start-btn" onclick="startApp()">▶ Mulai Absensi</button>
    <div id="error-msg"></div>
  </div>

  <div id="main-screen">
    <div id="camera-wrapper">
      <div id="camera"></div>
      <div id="live-badge">● LIVE</div>
    </div>
    <div id="status-bar">Memuat model...</div>

    <div id="detect-box">
      <div id="nis-label">—</div>
      <div id="conf-label">Arahkan wajah ke kamera</div>
    </div>

    <div id="send-box">
      <div class="box-title">▸ STATUS PENGIRIMAN KE GOOGLE SHEETS</div>
      <div id="send-status">Menunggu deteksi...</div>
      <div id="send-time"></div>
    </div>

    <div id="log-box">
      <div class="box-title">▸ RIWAYAT ABSENSI SESI INI</div>
      <div id="log-list"></div>
    </div>
  </div>

  <script>
    const MODEL_URL   = "https://teachablemachine.withgoogle.com/models/FQRrdIwRj/";
    const SCRIPT_URL  = "https://script.google.com/macros/s/AKfycbwrheASNSAvM1S287LSV2iO0EW2FwUlSjo1UzS2lnf4Vmj0m_XRe5HRpRjr3-7afML2Nw/exec";
    const THRESHOLD   = 0.90;
    const COOLDOWN_MS = 10000;

    let model, webcam;
    let sentLog   = {};
    let isSending = false;

    async function startApp() {
      document.getElementById("start-screen").style.display = "none";
      document.getElementById("main-screen").style.display = "flex";
      try {
        document.getElementById("status-bar").textContent = "Memuat model...";
        model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");

        document.getElementById("status-bar").textContent = "Menyalakan kamera...";
        webcam = new tmImage.Webcam(300, 300, true);
        await webcam.setup();
        await webcam.play();

        document.getElementById("camera").appendChild(webcam.canvas);
        document.getElementById("status-bar").textContent = "Mendeteksi wajah...";

        window.requestAnimationFrame(loop);
      } catch (err) {
        document.getElementById("main-screen").style.display = "none";
        document.getElementById("start-screen").style.display = "flex";
        document.getElementById("error-msg").textContent = "Error: " + err.message;
      }
    }

    async function loop() {
      webcam.update();
      await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const prediction = await model.predict(webcam.canvas);

      let top = prediction[0];
      for (let i = 1; i < prediction.length; i++) {
        if (prediction[i].probability > top.probability) top = prediction[i];
      }

      const nis = top.className;
      const pct = (top.probability * 100).toFixed(1);

      document.getElementById("nis-label").textContent = nis;
      document.getElementById("conf-label").textContent = `Kepercayaan: ${pct}%`;

      if (top.probability >= THRESHOLD && !isSending) {
        const now          = Date.now();
        const lastSentTime = sentLog[nis] || 0;
        if (now - lastSentTime > COOLDOWN_MS) {
          kirimKeSheets(nis);
        } else {
          const sisa = Math.ceil((COOLDOWN_MS - (now - lastSentTime)) / 1000);
          setStatus("sending", `⏳ Cooldown ${sisa}s — ${nis} sudah tercatat`);
        }
      }

      if (top.probability >= THRESHOLD && window.AppInventor) {
        window.AppInventor.setWebViewString(nis);
      }
    }

    async function kirimKeSheets(nis) {
      isSending = true;
      setStatus("sending", `⏳ Mengirim NIS: ${nis}...`);

      try {
        await new Promise((resolve) => {
          const img = new Image();
          img.onload  = () => resolve();
          img.onerror = () => resolve();
          img.src = SCRIPT_URL + "?nis=" + encodeURIComponent(nis);
          setTimeout(resolve, 3000);
        });

        sentLog[nis] = Date.now();
        const timeStr = new Date().toLocaleTimeString("id-ID");
        setStatus("success", `✓ Terkirim! NIS: ${nis}`);
        document.getElementById("send-time").textContent = `${timeStr} — data masuk ke Google Sheets`;
        tambahLog(nis, timeStr);

      } catch (err) {
        setStatus("error", "✗ Gagal: " + err.message);
      } finally {
        isSending = false;
      }
    }

    function setStatus(type, msg) {
      const el = document.getElementById("send-status");
      el.className   = type;
      el.textContent = msg;
    }

    function tambahLog(nis, time) {
      const list = document.getElementById("log-list");
      const item = document.createElement("div");
      item.className   = "log-item";
      item.textContent = `${time} — NIS: ${nis}`;
      list.insertBefore(item, list.firstChild);
      while (list.children.length > 20) list.removeChild(list.lastChild);
    }
  </script>
</body>
</html>
